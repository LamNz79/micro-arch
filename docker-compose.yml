services:
  backend-orders:
    build:
      context: ./backend-nestjs/orders-service
      dockerfile: Dockerfile
    container_name: backend-orders
    ports:
      - "3001:3001"
    env_file:
      - ./backend-nestjs/orders-service/.env
    image: lamlun123/backend-orders:1.0.1
  backend-inventory:
    build:
      context: ./backend-nestjs/inventory-service
      dockerfile: Dockerfile
    container_name: backend-inventory
    ports:
      - "3002:3002"
    env_file:
      - ./backend-nestjs/inventory-service/.env
    image: lamlun123/backend-inventory:1.0.1
    depends_on:
      - inventory-db
  inventory-db:
    image: postgres:15
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
    ports:
      - "5432:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
  kong:
    image: kong/kong-gateway:3.13
    container_name: kong
    ports:
      - "8000:8000"
      - "8443:8443"

    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"

      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: c8366794f0.us.cp.konghq.com:443
      KONG_CLUSTER_SERVER_NAME: c8366794f0.us.cp.konghq.com

      KONG_CLUSTER_TELEMETRY_ENDPOINT: c8366794f0.us.tp.konghq.com:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: c8366794f0.us.tp.konghq.com

      KONG_CLUSTER_CERT: /etc/kong/cluster.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/cluster.key

      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_ROUTER_FLAVOR: expressions

    volumes:
      - ./certs/cluster.crt:/etc/kong/cluster.crt:ro
      - ./certs/cluster.key:/etc/kong/cluster.key:ro

    depends_on:
      - backend-orders
      - backend-inventory
volumes:
  inventory-data:

